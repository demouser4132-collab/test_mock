# --- Datasource (in-memory H2, recreated each run, seeded from import.sql) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:points;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# --- Points program configuration ---
# Maximum points a single rent payment can award (applies to the FINAL award).
points.monthly-cap=50000

# --- HTTP ---
quarkus.http.port=8080
